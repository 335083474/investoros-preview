function formatMoney(minor) {
  if (minor === null || minor === undefined) return '待补全';
  if (typeof minor !== 'string' || !/^-?(0|[1-9]\d*)$/.test(minor) || minor === '-0') throw new TypeError('Invalid integer minor units');
  const negative = minor.startsWith('-');
  const digits = (negative ? minor.slice(1) : minor).padStart(3, '0');
  const whole = digits.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return `${negative ? '-' : ''}${whole}.${digits.slice(-2)}`;
}
function parseAmount(value) {
  const trimmed = value.trim();
  if (!/^(0|[1-9]\d{0,12})(\.\d{1,2})?$/.test(trimmed)) return null;
  const [whole, fraction = ''] = trimmed.split('.');
  const minor = (whole + fraction.padEnd(2, '0')).replace(/^0+(?=\d)/, '');
  return minor === '0' ? null : minor;
}

function parseDemoBps(value){
  if(typeof value!=='string')return {error:'请使用规范比例文字。'};
  const text=value.trim();if(text==='')return {value:null};
  if(!/^(0|[1-9]\d{0,2})(\.\d{1,2})?$/.test(text))return {error:'比例需为0至100，最多两位小数；空白表示未知。'};
  const [whole,fraction='']=text.split('.');
  const bps=Number(whole+fraction.padEnd(2,'0'));
  return bps<=10000?{value:bps}:{error:'比例不能超过100%。'};
}
function demoBpsText(value){
  if(value===null)return '';
  if(!Number.isInteger(value)||value<0||value>10000)throw new TypeError('Invalid bps');
  const s=String(value).padStart(3,'0');return `${s.slice(0,-2)}.${s.slice(-2)}`.replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
}
function systemFieldComplete(field,value){
  if(value===null||value===undefined)return false;
  if(field==='risk_limits')return value.single_instrument_limit_bps!==null&&value.total_equity_limit_bps!==null;
  if(field==='universe')return value.length>0;
  return typeof value==='string'&&value.trim().length>0;
}
function missingSystemFields(draft){return Object.keys(systemFieldNames).filter(field=>!systemFieldComplete(field,draft.answers[field]));}
function setDemoAnswer(draft,field,value){
  if(!Object.hasOwn(systemFieldNames,field))return {error:'未知栏目。'};
  let normalized=value;
  if(field==='universe'){
    if(value!==null&&(!Array.isArray(value)||value.some(v=>!Object.hasOwn(marketNames,v))||new Set(value).size!==value.length))return {error:'请选择已列出的市场，且不能重复。'};
    normalized=value?.length?[...value]:null;
  }else if(field==='risk_limits'){
    if(value!==null){
      const keys=['single_instrument_limit_bps','total_equity_limit_bps'];
      if(typeof value!=='object'||Array.isArray(value)||Object.keys(value).length!==2||keys.some(k=>!Object.hasOwn(value,k)||value[k]!==null&&(!Number.isInteger(value[k])||value[k]<0||value[k]>10000)))return {error:'风险限额仅接受两项0..10000整数基点或未知值。'};
      normalized={...value};
    }
  }else{
    if(value!==null&&(typeof value!=='string'||value.length>500||/[\u0000-\u001f\u007f-\u009f\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]/u.test(value)))return {error:'请填写500字以内的单行文字，不包含控制字符或双向显示控制符。'};
    normalized=value?.trim()||null;
  }
  if(JSON.stringify(draft.answers[field])===JSON.stringify(normalized))return {draft};
  return {draft:{revision:draft.revision+1,answers:{...draft.answers,[field]:normalized}}};
}
function demoSystemValue(field,value){
  if(!systemFieldComplete(field,value)&&field!=='risk_limits')return '暂未明确';

}

  backup:['备份与恢复留在本地程序',`<p>本页面没有访问数据库或执行备份。请使用本地程序提供的加密备份与恢复流程，核对档案身份和备份来源。</p><p class="dialog-notice">密钥及恢复凭证只在可信本地终端或系统凭据库处理，不要粘贴到网页、聊天或截图中。</p>`],
  connection:['继续使用已有的桌面 AI',`<p>InvestorOS 本地核心通过 STDIO MCP 与桌面 AI 协作。工具返回尽量少；云端宿主仍可能处理收到的摘要与主动提交的资料。</p><p>本原型未连接宿主、未修改客户端配置。真实客户端兼容性需单独实跑验收。</p>`],
};
function intent(){
  showDialog('先写下这次交易的计划',`<p>交互演示 · 请只填写虚构资料。草稿不写入数据库，也不会生成真实风控结论。</p><form id="intent-form"><div class="form-row"><div class="field"><label for="instrument">示例标的名称</label><input id="instrument" name="instrument" maxlength="40" value="示例 ETF" required autocomplete="off"></div><div class="field"><label for="side">方向</label><select id="side" name="side"><option value="buy">买入</option><option value="sell">卖出</option></select></div></div><div class="field"><label for="amount">计划金额 · CNY</label><input id="amount" name="amount" inputmode="decimal" placeholder="例如 5000.00" required autocomplete="off"><small class="muted">最多两位小数；请只填写虚构的演示金额。</small></div><div class="field"><label for="reason">决策理由 · 可留空</label><textarea id="reason" name="reason" maxlength="500" placeholder="这笔计划和你原有的原则有什么联系？"></textarea></div><p id="form-error" class="form-error" role="alert" hidden></p><button class="button primary" type="submit">预览示例草稿 ${icon('arrow')}</button></form>`);
}
function chooseSystemNode(id){
  const node=systemNodes.find(n=>n.id===id);if(!node)return;
  state.systemMap.selected=id;if(state.systemMap.tab!=='deck')state.systemMap.tab='map';
  render();document.querySelector(`[data-system-node="${id}"]`)?.focus({preventScroll:true});
  if(state.systemMap.tab==='deck')showDialog(node.title,renderRuleCardDetail(node,state.systemMap.draft,{e:escapeHTML,icon}));
}
document.addEventListener('click',event=>{
  const planFilter=event.target.closest('[data-plan-filter]');
  if(planFilter){state.planBoard.filter=planFilter.dataset.planFilter;state.planBoard.selected=selectedDemoPlan(state.planBoard)?.id||'';render();document.querySelector(`[data-plan-filter="${state.planBoard.filter}"]`)?.focus({preventScroll:true});return;}
  const planCard=event.target.closest('[data-plan-card]');
  if(planCard){state.planBoard.selected=selectedDemoPlan({filter:state.planBoard.filter,selected:planCard.dataset.planCard})?.id||'';render();document.querySelector(`[data-plan-card="${state.planBoard.selected}"]`)?.focus({preventScroll:true});if(window.matchMedia('(max-width:1020px)').matches)showDialog('计划详情 · 合成示例',renderPlanDetails(selectedDemoPlan(state.planBoard),{e:escapeHTML,icon,money}));return;}

  const systemNode=event.target.closest('[data-system-node]');
  if(systemNode){chooseSystemNode(systemNode.dataset.systemNode);return;}
  const systemTab=event.target.closest('[data-system-tab]');
  if(systemTab){state.systemMap.tab=systemTab.dataset.systemTab;render();document.querySelector(`[data-system-tab="${state.systemMap.tab}"]`).focus({preventScroll:true});return;}
  const systemEdit=event.target.closest('[data-system-edit]');
  if(systemEdit){const node=systemNodes.find(n=>n.id===systemEdit.dataset.systemEdit);showDialog(`编辑${node.title} · 演示草稿`,renderSystemEditor(node,state.systemMap.draft,escapeHTML));return;}
  if(event.target.closest('[data-system-next]')){
    const missing=missingSystemFields(state.systemMap.draft);
    const pending=systemNodes.filter(n=>n.fields.some(f=>missing.includes(f)));
    if(!pending.length){showDialog('九项描述均已填写','<p>这只表示有文字或数值，尚未验证规则是否严谨、适用或有效。请继续核对方法依据与独立验证证据。</p>');return;}
    const index=pending.findIndex(n=>n.id===state.systemMap.selected);chooseSystemNode(pending[(index+1)%pending.length].id);return;
  }
  const prompt=event.target.closest('[data-agent-prompt]');
  if(prompt){sendDemoMessage(prompt.dataset.agentPrompt);return;}
  if(event.target.closest('#agent-reset')){state.chat=[{role:'assistant',text:demoGreeting,links:[]}];state.chatInput='';render();document.querySelector('#agent-input').focus({preventScroll:true});return;}
  const pageButton=event.target.closest('[data-page]');
  if(pageButton){go(pageButton.dataset.page);return;}
  const filter=event.target.closest('[data-filter]');
  if(filter){state.filter=filter.dataset.filter;render();document.querySelector(`[data-filter="${state.filter}"]`).focus();return;}
  const action=event.target.closest('[data-action]');
  if(!action)return;
  const type=action.dataset.action;
  if(type==='system-method'){showDialog('方法依据 · 书目待确认','<p>目前根据项目已有的九项系统卡字段组织：目标、时间、周期、范围、入场、退出、风险、执行与复盘。</p><p>尚未绑定用户所指的书籍。确认书名后，再将书中概念映射到引导问题、字段和验证证据；不会把书中的示例自动设为用户的交易规则。</p><p class="dialog-notice">当前画布是界面结构，不能视为某本书的完整方法，也不证明系统有效。</p>');return;}
  if(type==='system-diff'){
    const changed=Object.keys(systemFieldNames).filter(f=>JSON.stringify(state.systemMap.draft.answers[f])!==JSON.stringify(demoSystemBaseline.answers[f]));
    const body=changed.length?changed.map(f=>`<li>${systemFieldNames[f]}<small>初始示例：${escapeHTML(demoSystemValue(f,demoSystemBaseline.answers[f]))}</small><small>当前演示：${escapeHTML(demoSystemValue(f,state.systemMap.draft.answers[f]))}</small></li>`).join(''):'<li>尚无变更<small>当前演示草稿与初始v1示例相同。</small></li>';
    showDialog('演示草稿与初始示例',`<ul class="detail-list">${body}</ul><p class="dialog-notice">初始v1示例不被改写；这些差异没有写入正式系统卡或投资计划。</p><button class="button" id="system-reset-example">恢复初始演示</button>`);
    document.querySelector('#system-reset-example').addEventListener('click',()=>{state.systemMap.draft=structuredClone(demoSystemBaseline);dialog.close();render();});return;
  }
  if(type==='intent'){intent();return;}
  if(type==='record'){
    const map={plan:'versions',check:'risk',journal:'journal',trade:'trade'};
    const key=map[action.dataset.record];
    if(key==='trade'){showDialog('合成成交 · T-024',list([['来源','示例交易记录，用于查看界面。'],['成交金额 · CNY',money('500000')],['费用','未知；不视为零。'],['覆盖说明','不是券商样本，不代表真实成交验收。']]));return;}
    showDialog(...notices[key]);return;
  }
  if(notices[type])showDialog(...notices[type]);
});
document.addEventListener('input',event=>{
  if(event.target.id==='agent-input'){state.chatInput=event.target.value;document.querySelector('.agent-send').disabled=!state.chatInput.trim();document.querySelector('#agent-error').hidden=true;}
  if(event.target.id==='record-search'){state.search=event.target.value;document.querySelector('#record-rows').innerHTML=filteredRows();}
});
document.addEventListener('change',event=>{if(event.target.id==='month-select'){state.month=event.target.value;render();document.querySelector('#month-select').focus();}});
document.addEventListener('submit',event=>{
  if(event.target.id==='system-edit-form'){
    event.preventDefault();const form=event.target;const node=systemNodes.find(n=>n.id===form.dataset.node);const data=new FormData(form);let draft=state.systemMap.draft;
    const showError=text=>{const err=document.querySelector('#system-form-error');err.textContent=text;err.hidden=false;};
    for(const field of node.fields){
      let value;
      if(field==='universe')value=data.getAll('universe');
      else if(field==='risk_limits'){
        const single=parseDemoBps(String(data.get('single_instrument_limit_bps')));const equity=parseDemoBps(String(data.get('total_equity_limit_bps')));
        if(single.error||equity.error){showError(single.error||equity.error);return;}
        value={single_instrument_limit_bps:single.value,total_equity_limit_bps:equity.value};
      }else value=String(data.get(field)||'');
      const result=setDemoAnswer(draft,field,value);if(result.error){showError(result.error);return;}draft=result.draft;
    }
    state.systemMap.draft=draft;dialog.close();render();(document.querySelector('.system-inspector [data-system-edit]')||document.querySelector(`[data-system-node="${state.systemMap.selected}"]`))?.focus({preventScroll:true});return;
  }
  if(event.target.id==='agent-form'){event.preventDefault();sendDemoMessage(state.chatInput);return;}
  if(event.target.id!=='intent-form')return;
  event.preventDefault();
  const data=new FormData(event.target);
  const minor=parseAmount(String(data.get('amount')));
  const instrument=String(data.get('instrument')).trim();
  if(!minor||!instrument){const err=document.querySelector('#form-error');err.textContent='请填写示例标的和大于零的规范金额（最多两位小数，不含逗号或指数）。';err.hidden=false;return;}
  state.draft={source:'demo',status:'unconfirmed',instrument,side:String(data.get('side')),amount:{minor,currency:'CNY'},reason:String(data.get('reason')).trim()};
  const d=state.draft;
  document.querySelector('#dialog-title').textContent='示例草稿已预览';
  document.querySelector('#dialog-body').innerHTML=`<div class="draft-preview"><h3>${escapeHTML(d.instrument)} · ${d.side==='buy'?'买入':'卖出'}</h3><p>计划金额 · CNY ${money(d.amount.minor)}</p><p>理由：${escapeHTML(d.reason||'未填写')}</p><span class="status-badge amber">未确认 · 仅当前页面内存</span></div><p class="dialog-notice">未写入档案，未计算风险，未执行交易。刷新清除；正式提案仍需本地核对并在可信终端确认。</p><button class="button" id="dismiss-draft">返回工作台</button>`;
  document.querySelector('#dismiss-draft').addEventListener('click',()=>dialog.close());
  document.querySelector('#dismiss-draft').focus();
});
document.addEventListener('keydown',event=>{if(event.target.id==='agent-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();document.querySelector('#agent-form').requestSubmit();}});
document.querySelector('#privacy-toggle').addEventListener('click',()=>{state.hidden=!state.hidden;render();});
document.querySelector('#about-demo').addEventListener('click',()=>showDialog(...notices.about));
document.querySelector('#close-dialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const b=dialog.getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)dialog.close();}});
document.querySelector('#menu-toggle').addEventListener('click',()=>{const side=document.querySelector('#sidebar');const open=side.classList.toggle('open');side.inert=!open;document.querySelector('#scrim').hidden=!open;document.querySelector('#menu-toggle').setAttribute('aria-expanded',String(open));if(open)side.querySelector('a').focus();});
document.querySelector('#scrim').addEventListener('click',closeMenu);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();const side=document.querySelector('#sidebar');if(event.key==='Tab'&&side.classList.contains('open')){const items=side.querySelectorAll('a[href],button:not([disabled])');const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
mobileLayout.addEventListener('change',closeMenu);
window.addEventListener('hashchange',()=>{state.page=views[location.hash.slice(1)]?location.hash.slice(1):'overview';render();});
state.page=views[location.hash.slice(1)]?location.hash.slice(1):'overview';
closeMenu();
render();
</script>
